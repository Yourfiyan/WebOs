<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SufiyanOS</title>
</head>
<body>
  <div id="top">
    <button id="welcomeopen">SufiyanOS</button>
    <span>Personal workspace</span>
    <span id="timeElement">Loading time…</span>
  </div>

  <div id="welcome" style="top: 50%; left: 50%;">
    <div id="welcomeheader">
      <p>SufiyanOS</p>
    </div>
    <div>
      <h1>Welcome to SufiyanOS</h1>
      <p>Your personal web operating system.</p>
    </div>
  </div>

  <script>
    function updateTime() {
      document.querySelector("#timeElement").innerHTML = new Date().toLocaleString();
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
